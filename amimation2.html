<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: absolute;
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            border-radius: 50px;
            animation: move 1s ease-in-out 0s 100 alternate ;
        }
        @keyframes move{
            from{
                left: 0px;

            }
            to{
                left: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
