<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: relative;
            background-color: blueviolet;
            border-radius: 50px;
            height: 100px;
            width: 100px;

        }
        .box1{
            animation: move 1s ease-in-out 0s 100 alternate;
        }
        .box2{
            animation: move 1s ease-in-out 500ms 1000 alternate;
        }
        .box3{
            animation: move 1s ease-in-out 1000ms 1000 alternate;
        }
        @keyframes move{
            from{
                left: 0px;
            }
            to{
                left: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="box box1" ></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    
</body>
</html>
